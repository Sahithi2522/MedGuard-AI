ction><section class="wrap section" id="safety"><div class="callout"><b>Prototype safety notice.</b> MedGuard AI is an educational medication safety decision-support prototype. It is not a substitute for professional medical advice, diagnosis, or treatment. Medication analysis may be incomplete or uncertain. Consult a qualified healthcare professional for clinical decisions. No clinical interaction reference dataset is configured in this demo.</div><div class="disclaimer">Demo records are synthetic. This local prototype is not clinically validated and does not offer emergency care or medication recommendations.</div></section></main><footer class="wrap footer"><a class="brand" href="/" aria-label="MedGuard AI home"><span class="brand-mark">${icons.shield}</span><span>MedGuard AI</span></a><span>Privacy-minded prototype · Local demo data only</span><a href="${route('login')}" target="_blank" rel="noopener">Sign in ${icons.arrow}</a></footer>`;}
    function authPage(signup=false){app.innerHTML=`<main class="auth-shell"><section class="auth-story"><a class="brand" href="/" aria-label="MedGuard AI home"><span class="brand-mark">${icons.shield}</span><span>MedGuard AI<small>MEDICATION SAFETY</small></span></a><div><span class="eyebrow">${signup?'Create a demo workspace':'Secure demo access'}</span><h1>${signup?'Care works better when the details are clear.':'A calmer place to review your medication list.'}</h1><p>Role-based demo access with synthetic records. Your password is hashed on the local server; the app never stores it in browser storage.</p></div><div class="disclaimer">Educational prototype only. Automated screening can be incomplete; clinical decisions belong with a qualified healthcare professional.</div></section><section class="auth-card-wrap"><form class="auth-card glass" id="auth-form"><h2>${signup?'Create an account':'Welcome back'}</h2><p>${signup?'Register a local demo account to explore your role workspace.':'Sign in to open the dashboard assigned to your account.'}</p><div class="error-box" id="auth-error" role="alert"></div>${signup?`<div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required maxlength="100" placeholder="Your name"></div>`:''}<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><div class="password-input"><input id="password" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required ${signup?'minlength="10"':''} placeholder="${signup?'At least 10 characters':'Password'}"><button class="password-toggle" id="toggle-password" type="button" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>${signup?`<div class="field"><label for="role">Workspace role</label><select id="role" name="role"><option value="patient">Patient</option><option value="doctor">Doctor (demo)</option><option value="pharmacist">Pharmacist (demo)</option><option value="caregiver">Caregiver (demo)</option></select></div>`:''}<button class="btn btn-primary" type="submit">${signup?'Create demo account':'Sign in securely'} ${icons.arrow}</button><p class="auth-switch">${signup?'Already have an account?':'New to the demo?'} <a href="${route(signup?'login':'signup')}" target="_blank" rel="noopener">${signup?'Sign in':'Create an account'}</a></p>${!signup?`<div class="demo-note"><b>Demo access</b><br>Choose a role to fill its synthetic account. Password: <code>12345678</code><div class="field"><label for="demo-account">Demo role</label><select id="demo-account"><option value="patient">Patient</option><option value="doctor">Doctor</option><option value="pharmacist">Pharmacist</option><option value="admin">Administrator</option><option value="caregiver">Caregiver</option></select></div></div>`:''}<a class="auth-switch" href="/" style="display:block;text-decoration:none">← Back to overview</a></form></section></main>`;
      const demo=document.getElementById('demo-account');if(demo){const fillDemo=()=>{document.getElementById('email').value=demo.value+'@medguard.demo';document.getElementById('password').value='12345678'};demo.addEventListener('change',fillDemo);fillDemo()}
      const passwordInput=document.getElementById('password');const passwordToggle=document.getElementById('toggle-password');passwordToggle.addEventListener('click',()=>{const showPassword=passwordInput.type==='password';passwordInput.type=showPassword?'text':'password';passwordToggle.setAttribute('aria-label',showPassword?'Hide password':'Show password');passwordToggle.setAttribute('title',showPassword?'Hide password':'Show password')});document.getElementById('auth-form').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);const payload=Object.fromEntries(form.entries());const error=document.getElementById('auth-error');error.classList.remove('show');try{await api(signup?'/api/auth/register':'/api/auth/login',{method:'POST',body:JSON.stringify(payload)});location.href=route('home')}catch(err){error.textContent=err.message;error.classList.add('show')}});

    const navByRole={patient:[['home','Overview','grid'],['medications','My medications','pill'],['checker','Safety checker','scan'],['schedule','Schedule','calendar'],['reviews','Review requests','users'],['reports','Safety reports','file']],doctor:[['home','Overview','grid'],['reviews','Review queue','users'],['patients','Patients','heart'],['checker','Interaction checker','scan'],['reports','Review history','file']],pharmacist:[['home','Overview','grid'],['reviews','Review queue','users'],['medications','Medication review','pill'],['checker','Ingredient checker','scan'],['reports','Review history','file']],admin:[['home','Overview','grid'],['users','User management','users'],['reports','System activity','file']],caregiver:[['home','Overview','grid'],['schedule','Care schedule','calendar'],['reviews','Review requests','users']]};
    async function dashboard(){const data=await api('/api/dashboard');const role=currentUser.role;const nav=navByRole[role]||navByRole.patient;const view=nav.some(item=>item[0]===requestedView)||requestedView==='notifications'?requestedView:'home';const title=(nav.find(item=>item[0]===view)||[])[1]||(view==='notifications'?'Notifications':'Overview');const metrics=data.metrics||{};const metricEntries=role==='patient'?[['medications','Current medicines','pill'],['pending_reviews','Pending reviews','clock'],['checks','Safety checks','scan'],['alerts','New alerts','shield']]:role==='admin'?[['users','Demo users','users'],['patients','Patient accounts','heart'],['reviews','Review requests','file'],['medications','Medication records','pill']]:role==='caregiver'?[['dependents','Authorized dependents','users'],['reminders','Upcoming reminders','bell']]:[['pending_reviews','Pending reviews','clock'],['completed_reviews','Completed reviews','check'],['patients','Patients in queue','users'],['alerts','High priority','shield']];

      app.innerHTML=`<div class="app-shell"><aside class="sidebar"><a class="brand" href="${route('home')}" target="_blank" rel="noopener" aria-label="Open overview in new tab"><span class="brand-mark">${icons.shield}</span><span>MedGuard AI<small>DEMO WORKSPACE</small></span></a><div class="nav-label">WORKSPACE</div><nav class="side-nav">${side}</nav><div class="side-bottom"><div class="safety-note">Synthetic demo data. No interaction reference database is connected.</div><button class="btn btn-quiet btn-small" id="logout" style="width:100%">Sign out</button></div></aside><main class="main"><header class="app-top"><div class="crumb"><a class="icon-link mobile-menu" href="${route('home')}" target="_blank" rel="noopener" aria-label="Open overview in a new tab">${icons.menu}</a>Workspace / <b>${esc(title)}</b></div><div class="top-right"><label class="search" aria-label="Search this demo">${icons.search}<input id="quick-search" placeholder="Search workspace" aria-label="Search workspace"></label><a class="icon-link" href="${route('notifications')}" target="_blank" rel="noopener" aria-label="Open notifications in a new tab" title="Notifications">${icons.bell}</a><div class="profile"><span class="avatar">${esc(currentUser.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><span><b>${esc(currentUser.name)}</b><small>${esc(role)}</small></span></div></div></header><section class="content"><div class="page-heading"><div><span class="eyebrow">${esc(role)} workspace</span><h1>${view==='home'?`Welcome, ${esc(currentUser.name.split(' ')[0])}`:esc(title)}</h1><p>${view==='home'?'Your medication safety workspace is ready.':pageDescription(view,role)}</p></div><span class="role-chip">${esc(role)} · demo</span></div>${view==='home'?homeContent(role,data,metricEntries):pageContent(view,role,data)}</section></main><nav class="mobile-bottom">${mobile}</nav></div>`;

    function pageDescription(view,role){return ({medications:'Review the medicine records saved to this demo account.',checker:'Check exact ingredient duplicates and incomplete medicine entries.',schedule:'A schedule view for this prototype; no dose reminders are sent.',reviews:role==='patient'?'Track requests you have submitted for professional review.':'Review requests are synthetic workflow examples.',reports:'No clinical interaction reference or report export is configured.',users:'Synthetic user accounts only. Patient health details are not shown here.',patients:'No patient records are assigned in this demo.',notifications:'No email, SMS, or live notification integration is configured.'})[view]||'A synthetic, role-specific workspace.'}
    function metricCards(entries,metrics){return `<div class="metric-grid">${entries.map(([key,label,icon])=>`<article class="metric glass"><div class="metric-head"><span>${label}</span><span class="metric-icon">${icons[icon]}</span></div><strong>${Number(metrics[key]||0).toString().padStart(2,'0')}</strong></article>`).join('')}</div>`}
    function homeContent(role,data,metricEntries){let extra='';if(role==='patient'){const meds=data.medications||[];extra=`<div class="dashboard-grid"><section class="panel glass"><div class="panel-head"><h2>My medication list</h2><a class="text-link" href="${route('medications')}" target="_blank" rel="noopener">Open list ${icons.arrow}</a></div>${meds.length?medicationTable(meds):emptyState('No medicines recorded','Add a confirmed medication record to begin.')}<form id="add-med-form" class="form-inline"><input name="name" required maxlength="120" placeholder="Medicine name" aria-label="Medicine name"><input name="ingredient" required maxlength="120" placeholder="Active ingredient" aria-label="Active ingredient"><input name="strength" maxlength="40" placeholder="Strength (optional)" aria-label="Strength"><button class="btn btn-primary btn-small" type="submit">${icons.plus} Add</button></form></section><section class="panel glass"><div class="panel-head"><h2>Next steps</h2>${link('checker','', 'scan','icon-link')}</div><div class="stack"><div class="action-row"><span><b>Run a data-quality check</b><small>Exact duplicate ingredient check only</small></span><button class="btn btn-quiet btn-small" data-action="check">Check list</button></div><div class="action-row"><span><b>Ask for a professional review</b><small>Demo workflow request</small></span><button class="btn btn-quiet btn-small" data-action="review">Request</button></div></div><div class="callout">This demo does not check drug-drug interactions, allergies, dosage safety, or whether medicines are safe together.</div></section></div>`}else if(role==='doctor'||role==='pharmacist'){extra=reviewPanel(data.reviews||[],role)}else if(role==='admin'){extra=`<section class="panel glass" style="margin-top:14px"><div class="panel-head"><h2>Demo accounts</h2><span class="badge">Synthetic identities</span></div>${userTable(data.recent_users||[])}</section>`}else{extra=`<div class="dashboard-grid"><section class="panel glass"><h2 style="font-size:14px">Care access</h2><p class="secondary" style="font-size:12px;line-height:1.6">No dependent has authorized access in this demo. Health information stays hidden until a real consent and caregiver authorization flow is configured.</p></section><section class="panel glass"><h2 style="font-size:14px">Reminders</h2><p class="secondary" style="font-size:12px">No medication reminders are scheduled or sent.</p></section></div>`}return `${metricCards(metricEntries,data.metrics||{})}${extra}`}
    function emptyState(title,description){return `<div class="empty"><b>${title}</b>${description}</div>`}
    function medicationTable(meds){return `<div style="overflow:auto"><table class="table"><thead><tr><th>Medicine</th><th>Ingredient / source</th><th>Strength</th><th>Schedule</th></tr></thead><tbody>${meds.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.ingredient)}<br><small>${esc(m.source||'Patient-entered')}${m.prescriber_name?` · ${esc(m.prescriber_name)}`:''}</small></td><td>${esc(m.strength||'Not entered')}</td><td>${esc(m.schedule||'As prescribed')}</td></tr>`).join('')}</tbody></table></div>`}
    function userTable(users){return `<div style="overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Account</th></tr></thead><tbody>${users.map(user=>`<tr><td>${esc(user.name)}</td><td>${esc(user.email)}</td><td>${esc(user.role)}</td><td><span class="badge">Synthetic</span></td></tr>`).join('')}</tbody></table></div>`}
    function reviewPanel(reviews,role){return `<section class="panel glass" style="margin-top:14px"><div class="panel-head"><h2>${role==='doctor'?'Doctor':'Pharmacist'} review queue</h2><span class="badge pending">${reviews.filter(r=>r.status==='Pending').length} pending</span></div>${reviews.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Patient</th><th>Request</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${reviews.map(r=>`<tr><td>${esc(r.patient_name||'Demo patient')}</td><td>${esc(r.review_type)} review</td><td><span class="badge ${r.status==='Pending'?'pending':r.status==='Escalated'?'escalated':'completed'}">${esc(r.status)}</span></td><td>${new Date(r.created_at*1000).toLocaleDateString()}</td><td>${r.status==='Pending'?`<button class="btn btn-quiet btn-small" data-review="${r.id}" data-status="In review">Start</button>`:r.status==='In review'?`<button class="btn btn-quiet btn-small" data-review="${r.id}" data-status="Completed">Complete</button> <button class="btn btn-quiet btn-small" data-review="${r.id}" data-status="Escalated">Escalate</button>`:`<span class="secondary">Recorded</span>`}</td></tr>`).join('')}</tbody></table></div>`:emptyState('No review requests yet','New patient requests for this role will appear here.')}</section>`}
    function pageContent(view,role,data){if(view==='medications')return `<section class="panel glass"><div class="panel-head"><h2>Recorded medication list</h2>${role==='patient'?`<span class="badge">Patient-owned records</span>`:''}</div>${role==='patient'?(data.medications||[]).length?medicationTable(data.medications):emptyState('No medicines recorded','Add medicines from the overview.'):`<p class="secondary" style="font-size:12px">Medication records are not shared across demo accounts. Patient-level authorization and explicit consent are required for access.</p>`}${role==='patient'?'<p class="disclaimer-small">Entries are user-provided and not verified against a licensed medication catalog.</p>':''}</section>`;
      if(view==='checker')return `<section class="panel glass"><div class="panel-head"><h2>Ingredient duplicate screening</h2><span class="badge pending">Limited demo rule</span></div><p class="secondary" style="font-size:12px;line-height:1.6">This check compares ingredient text for exact duplicates only. It does not evaluate drug interactions, allergies, conditions, formulations, strengths, doses, or treatment safety.</p><div class="toolbar"><button class="btn btn-primary btn-small" data-action="check">${icons.scan} Check saved medication list</button></div><div id="check-results" class="results"></div><p class="disclaimer-small">No known interaction cannot be inferred: interaction reference data is not configured.</p></section>`;

      if(view==='schedule')return `<section class="panel glass"><div class="panel-head"><h2>Medication schedule</h2><span class="badge">Not configured</span></div>${emptyState('No dose schedule is active','This prototype does not create dose timings or send medication reminders. Follow the confirmed instructions from your clinician or prescription.')}</section>`;
      if(view==='reports')return `<section class="panel glass"><div class="panel-head"><h2>${role==='admin'?'System activity':'Safety reports'}</h2><span class="badge">Demo limitation</span></div>${role==='admin'?userTable(data.recent_users||[]):emptyState('No clinical safety reports available','A report requires a verified clinical reference dataset. This demo only checks exact duplicate ingredient entries and does not create clinical reports.')}</section>`;
      if(view==='users')return `<section class="panel glass"><div class="panel-head"><h2>Accounts in this demo</h2><span class="badge">No patient details</span></div>${userTable(data.recent_users||[])}</section>`;

    function reviewPatientTable(reviews){return `<div style="overflow:auto"><table class="table"><thead><tr><th>Review type</th><th>Status</th><th>Requested</th></tr></thead><tbody>${reviews.map(r=>`<tr><td>${esc(r.review_type)} review</td><td><span class="badge ${r.status==='Pending'?'pending':r.status==='Escalated'?'escalated':'completed'}">${esc(r.status)}</span></td><td>${new Date(r.created_at*1000).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`}
    function bindActions(view,role,data){const search=document.getElementById('quick-search');if(search)search.addEventListener('input',()=>{const term=search.value.trim().toLowerCase();document.querySelectorAll('.table tbody tr,.action-row').forEach(row=>{row.hidden=term.length>0&&!row.innerText.toLowerCase().includes(term)})});document.querySelectorAll('[data-action="review"]').forEach(button=>button.addEventListener('click',async()=>{const choice=prompt('Request a doctor or pharmacist review? Enter doctor or pharmacist.');if(!choice)return;try{await api('/api/reviews',{method:'POST',body:JSON.stringify({review_type:choice.trim().toLowerCase()})});alert('Review request created.');location.reload()}catch(error){alert(error.message)}}));document.querySelectorAll('[data-action="check"]').forEach(button=>button.addEventListener('click',async()=>{const result=document.getElementById('check-results');if(result)result.innerHTML='<div class="result-item">Checking entered ingredient records…</div>';try{const payload=await api('/api/safety/check',{method:'POST',body:JSON.stringify({medications:data.medications||[]})});if(result)result.innerHTML=`${payload.duplicate_ingredients.length?payload.duplicate_ingredients.map(item=>`<div class="result-item"><strong>Possible exact duplicate entry</strong>${esc(item)} appears more than once in the entered list. Confirm the medicine labels with a healthcare professional.</div>`).join(''):'<div class="result-item"><strong>No exact duplicate ingredient text found</strong>This is not evidence that the combination is safe. Interactions and other risks are not checked.</div>'}${payload.incomplete_records.map(item=>`<div class="result-item"><strong>Ingredient missing</strong>${esc(item)} cannot be compared until its active ingredient is confirmed.</div>`).join('')}<p class="disclaimer-small">${esc(payload.message)}</p>`}catch(error){if(result)result.textContent=error.message}}));document.querySelectorAll('[data-review]').forEach(button=>button.addEventListener('click',async()=>{try{await api(`/api/reviews/${button.dataset.review}/status`,{method:'POST',body:JSON.stringify({status:button.dataset.status})});location.reload()}catch(error){alert(error.message)}}));const form=document.getElementById('add-med-form');if(form)form.addEventListener('submit',async event=>{event.preventDefault();const body=Object.fromEntries(new FormData(form).entries());try{await api('/api/medications',{method:'POST',body:JSON.stringify(body)});location.reload()}catch(error){alert(error.message)}})}
    async function start(){if(['login','signup'].includes(requestedView))return authPage(requestedView==='signup');try{const auth=await api('/api/auth/me');currentUser=auth.user;if(currentUser)return await dashboard()}catch(error){}landing()}

  <script>
    const syncNavigationAndSignup=()=>{document.querySelectorAll('#app a').forEach(link=>{link.removeAttribute('target');link.removeAttribute('rel');link.title=link.title.replace(/\s+(?:in a new tab|in new tab|new tab)/ig,'');const label=link.getAttribute('aria-label');if(label)link.setAttribute('aria-label',label.replace(/\s+(?:in a new tab|in new tab|new tab)/ig,''))});const roleSelect=document.querySelector('#app #role');if(roleSelect)Array.from(roleSelect.options).filter(option=>!['patient','caregiver'].includes(option.value)).forEach(option=>option.remove())};
    const installMobileMenu=()=>{const oldMenu=document.querySelector('#app a.mobile-menu');const sidebar=document.querySelector('#app .sidebar');if(!sidebar)return;let menu=document.querySelector('#app button.mobile-menu');if(oldMenu){menu=document.createElement('button');menu.type='button';menu.className=oldMenu.className;menu.setAttribute('aria-label','Open workspace navigation');menu.setAttribute('aria-expanded','false');menu.innerHTML=oldMenu.innerHTML;menu.addEventListener('click',()=>{const open=sidebar.classList.toggle('mobile-open');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Close workspace navigation':'Open workspace navigation')});oldMenu.replaceWith(menu)}if(!sidebar.querySelector('.mobile-nav-close')){const close=document.createElement('button');close.type='button';close.className='btn btn-quiet btn-small mobile-nav-close';close.textContent='Close navigation';close.addEventListener('click',()=>{sidebar.classList.remove('mobile-open');menu?.setAttribute('aria-expanded','false');menu?.setAttribute('aria-label','Open workspace navigation')});sidebar.insertBefore(close,sidebar.querySelector('.nav-label'))}sidebar.querySelectorAll('.side-nav a').forEach(link=>link.addEventListener('click',()=>{sidebar.classList.remove('mobile-open');menu?.setAttribute('aria-expanded','false');menu?.setAttribute('aria-label','Open workspace navigation')}))};
    syncNavigationAndSignup();installMobileMenu();new MutationObserver(()=>{syncNavigationAndSignup();installMobileMenu()}).observe(document.getElementById('app'),{childList:true,subtree:true});
  </script>
  <script src="/features.js"></script>
  <script src="/decorations.js"></script>
  <style>.mobile-logout,.mobile-nav-close{display:none}@media(max-width:680px){.mobile-logout{display:inline-flex;min-height:33px;padding:0 9px;font-size:10px}.sidebar.mobile-open{display:flex!important;position:fixed;inset:0 auto 0 0;height:100dvh;width:260px;z-index:20;box-shadow:0 0 0 100vmax rgba(21,49,61,.22)}.mobile-menu{cursor:pointer;border:1px solid var(--line)}.mobile-nav-close{display:inline-flex;margin:0 8px 12px}}</style>
  <script>
    const ensureMobileLogout=()=>{const topbar=document.querySelector('#app .top-right');if(!topbar||topbar.querySelector('.mobile-logout'))return;const button=document.createElement('button');button.type='button';button.className='btn btn-quiet btn-small mobile-logout';button.textContent='Sign out';button.addEventListener('click',async()=>{try{await api('/api/auth/logout',{method:'POST',body:'{}'})}finally{location.href='/'}});topbar.append(button)};
    ensureMobileLogout();new MutationObserver(ensureMobileLogout).observe(document.getElementById('app'),{childList:true,subtree:true});
  </script>
</body>
