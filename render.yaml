services:
  - type: web
    name: medguard-ai
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MEDGUARD_DB
        value: /tmp/medguard.sqlite3
      - key: MEDGUARD_UPLOAD_DIR
        value: /tmp/medguard_uploads
      - key: MEDGUARD_COOKIE_SECURE
        value: "1"